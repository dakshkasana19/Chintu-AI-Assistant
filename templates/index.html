<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Assistant UI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <video autoplay muted loop id="bg-video">
        <source src="{{ url_for('static', filename='background_loop.mp4') }}" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="assistant-container">
        <h1 class="title">Aura</h1>
        <div class="mic-area">
            <div class="mic-glow">
                <div class="aura-logo">
                    <div class="logo-inner"></div>
                </div>
            </div>
        </div>
        <p class="status-text">Listening... Speak your command.</p>

        <div class="bottom-menu">
            <button class="menu-btn">Set Up Voice</button>
            <button class="menu-btn">Customise Voice</button>
            <button class="menu-btn">Wake Word</button>
            <button class="menu-btn">Language</button>
            <button class="menu-btn">Voice Notes</button>
            <button class="menu-btn">Help & Feedback</button>
        </div>
    </div>

    <div id="setup-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="modal-title">Application Voice Setup</h2>
            <p class="modal-description">Register an application path and define the voice command for it.</p>
            
            <div class="form-group">
                <label for="app-path">Application Path (e.g., C:\Program Files\App.exe)</label>
                <input type="text" id="app-path" placeholder="Paste the full file path here..." required>
            </div>
            
            <div class="form-group">
                <label for="app-name">Voice Command Name (e.g., 'launch game', 'open work files')</label>
                <input type="text" id="app-name" placeholder="Name you will speak..." required>
            </div>

            <div class="modal-actions">
                <button id="register-btn" class="modal-btn primary">Register Command</button>
                <button id="close-modal-btn" class="modal-btn secondary">Close</button>
            </div>
            
            <p id="setup-message" class="message-text"></p>
        </div>
    </div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
